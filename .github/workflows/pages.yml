name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 official Linux + export templates
        run: |
          set -euo pipefail
          GODOT_VER=4.7.2
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable"
          curl -fL --retry 5 --retry-delay 4 -o godot.zip \
            "${BASE}/Godot_v${GODOT_VER}-stable_linux.x86_64.zip"
          curl -fL --retry 5 --retry-delay 4 -o export_templates.tpz \
            "${BASE}/Godot_v${GODOT_VER}-stable_export_templates.tpz"
          unzip -q godot.zip
          EXACT="Godot_v${GODOT_VER}-stable_linux.x86_64"
          if [ -f "$EXACT" ]; then
            GODOT_BIN="$PWD/$EXACT"
          else
            GODOT_BIN="$(find "$PWD" -type f -name 'Godot_v*' ! -name '*.zip' | head -n1)"
          fi
          if [ -z "$GODOT_BIN" ] || [ ! -f "$GODOT_BIN" ]; then
            echo "Could not find Godot Linux binary after unzip (GODOT_BIN is empty)."
            echo "--- ls ---"
            ls -la
            echo "--- find Godot_v* ---"
            find "$PWD" -name 'Godot_v*' -print
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          DEST="${HOME}/.local/share/godot/export_templates/${GODOT_VER}.stable"
          mkdir -p "$DEST"
          unzip -q export_templates.tpz -d /tmp/godot_templates
          if [ -d /tmp/godot_templates/templates ]; then
            cp -a /tmp/godot_templates/templates/. "$DEST/"
          else
            cp -a /tmp/godot_templates/. "$DEST/"
          fi

      - name: Ensure Web export has threads off
        run: |
          if [ -f export_presets.cfg ]; then
            sed -i 's/^variant\/thread_support=.*/variant\/thread_support=false/' export_presets.cfg
          fi

      - name: Export release Web
        run: |
          set -euo pipefail
          mkdir -p export/web
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . --export-release "Web" export/web/index.html
          touch export/web/.nojekyll
          test -f export/web/index.html
          test -f export/web/index.wasm

      - name: Cache-bust Godot loader (pck/wasm/js)
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          export SHA
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          sha = os.environ["SHA"]
          if not re.fullmatch(r"[0-9a-fA-F]{7}", sha):
              print(f"Refusing to patch with invalid short SHA: {sha!r}", file=sys.stderr)
              sys.exit(1)

          root = pathlib.Path("export/web")
          html_path = root / "index.html"
          js_path = root / "index.js"
          if not html_path.is_file():
              print("export/web/index.html missing", file=sys.stderr)
              sys.exit(1)

          # Do not rename the executable or rewrite `.pck`/`.wasm` concatenations.
          # Those become Godot's --main-pack / FS path. Query-string bust on the
          # HTTP request is enough (GitHub Pages max-age=600 + IndexedDB/HTTP cache).
          engine_file = re.compile(r'(?<![\w./-])index\.(pck|wasm)(?!\?)')
          script_src = re.compile(r'(src=["\'])index\.js(["\'])')

          html = html_path.read_text(encoding="utf-8")
          comment = (
              f"<!-- hellfall-build: {sha} "
              f"index.js?{sha} index.pck?{sha} index.wasm?{sha} -->"
          )
          if f"hellfall-build: {sha}" not in html:
              if "<head>" in html:
                  html = html.replace("<head>", f"<head>\n{comment}", 1)
              else:
                  html = comment + "\n" + html

          html = script_src.sub(rf"\1index.js?{sha}\2", html)
          if f"index.js?{sha}" not in html:
              html = re.sub(
                  r'(<script[^>]+src=["\'])index\.js(["\'])',
                  rf"\1index.js?{sha}\2",
                  html,
                  count=1,
              )

          interceptor = f"""<script data-hellfall-fetch-bust="1">
          (function () {{
            var SHA = {sha!r};
            function bust(u) {{
              if (typeof u !== "string") return u;
              try {{
                var url = new URL(u, window.location.href);
                var base = url.pathname.split("/").pop();
                if (base !== "index.pck" && base !== "index.wasm" && base !== "index.js") return u;
                if (url.search.indexOf(SHA) !== -1) return url.href;
                url.search = SHA;
                return url.href;
              }} catch (e) {{
                return u;
              }}
            }}
            if (typeof window.fetch === "function") {{
              var origFetch = window.fetch;
              window.fetch = function (input, init) {{
                if (typeof input === "string") {{
                  input = bust(input);
                }} else if (typeof Request !== "undefined" && input instanceof Request) {{
                  var next = bust(input.url);
                  if (next !== input.url) input = new Request(next, input);
                }}
                return origFetch.call(this, input, init);
              }};
            }}
          }})();
          </script>
          """
          if "hellfall-fetch-bust" not in html:
              if "</head>" in html:
                  html = html.replace("</head>", interceptor + "</head>", 1)
              elif "<script" in html:
                  html = html.replace("<script", interceptor + "<script", 1)
              else:
                  html = interceptor + html

          html_path.write_text(html, encoding="utf-8")

          if js_path.is_file():
              js = js_path.read_text(encoding="utf-8", errors="replace")
              if re.search(r'(?<![\w./-])index\.(pck|wasm)(?!\?)', js):
                  js_path.write_text(engine_file.sub(rf"index.\1?{sha}", js), encoding="utf-8")

          html_out = html_path.read_text(encoding="utf-8")
          js_out = js_path.read_text(encoding="utf-8", errors="replace") if js_path.is_file() else ""
          checks = [
              f"hellfall-build: {sha}" in html_out,
              f"index.js?{sha}" in html_out,
              f"index.pck?{sha}" in html_out,
              f"index.wasm?{sha}" in html_out,
              "hellfall-fetch-bust" in html_out,
          ]
          if not all(checks):
              print("Cache-bust patch did not land expected query strings.", file=sys.stderr)
              print(
                  f"comment={checks[0]} js={checks[1]} pck={checks[2]} "
                  f"wasm={checks[3]} fetch={checks[4]}",
                  file=sys.stderr,
              )
              sys.exit(1)
          # Keep the on-disk executable names; only the request URL is busted.
          if not (root / "index.html").is_file() or not (root / "index.wasm").is_file():
              print("Required export files missing after cache-bust.", file=sys.stderr)
              sys.exit(1)
          print(f"Cache-busted Godot web loader with ?{sha}")
          print(f"index.js hardcoded engine names patched: {bool(js_out and 'index.pck?'+sha in js_out)}")
          PY
          test -f export/web/index.html
          test -f export/web/index.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
